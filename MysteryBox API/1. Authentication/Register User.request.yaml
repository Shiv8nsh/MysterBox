$kind: http-request
description: Registers a new detective account and automatically saves the auth token to the Postman environment.
url: "{{baseUrl}}/api/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Detective Sherlock",
      "email": "detective@example.com",
      "password": "Sherlock123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("token", jsonData.token);
          console.log("Saved auth token to environment:", jsonData.token);
      }
    language: text/javascript
order: 1000
